# Sitio Apache para Storytelling Studio.
#   api.storyteller.fierro.dev -> API (gunicorn en 127.0.0.1:8006)
# La web (storytelling.fierro.dev) se publica en Netlify (server/frontend).
#
# Requiere: a2enmod proxy proxy_http headers
# Tras editar: apache2ctl configtest && systemctl reload apache2
# HTTPS: certbot --apache -d api.storyteller.fierro.dev

<VirtualHost *:80>
    ServerName api.storyteller.fierro.dev

    # Subidas (fotos de Escalera)
    LimitRequestBody 26214400

    ProxyPreserveHost On
    # Progreso en vivo (SSE) y long-poll del worker: el servidor manda un ping
    # cada 15 s y el long-poll dura 25 s, así que 300 s nunca corta nada vivo.
    ProxyTimeout 300
    # flushpackets: cada evento de progreso (SSE) llega al teléfono al instante
    ProxyPass / http://127.0.0.1:8006/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8006/

    RequestHeader set X-Forwarded-Proto "https" env=HTTPS
    RequestHeader set X-Forwarded-Proto "http" env=!HTTPS

    ErrorLog ${APACHE_LOG_DIR}/storyteller-api-error.log
    CustomLog ${APACHE_LOG_DIR}/storyteller-api-access.log combined
</VirtualHost>
