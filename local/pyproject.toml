[project]
name = "storytelling-studio"
version = "0.2.0"
description = "Estudio de videos verticales con varias modalidades: Conversación (charla) y Escalera (escalator), una sola web con historial compartido"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.11",
    "google-genai>=1.20",
    "edge-tts>=7.3.1",
    "num2words>=0.5.13",
    "pydantic>=2.7",
    "requests>=2.31",
    "trafilatura>=1.8",
    # web app (studio): one FastAPI backend for every modality
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",  # worker <-> server (studio.worker)
]

[project.optional-dependencies]
ui = ["gradio>=6.0"]
# Escalera, local TTS on CPU. Install torch first (XPU build, see install.ps1).
tts-local = ["kokoro>=0.9.4", "soundfile>=0.12"]
# Escalera, local images on the Intel iGPU. Needs torch XPU (see install.ps1).
image-local = ["diffusers>=0.35", "transformers>=4.45", "accelerate>=1.0",
               "gguf>=0.10", "sentencepiece", "protobuf", "peft",
               # rotate3d motion: BiRefNet matte (remote code) + LaMa inpainting
               "einops", "kornia", "timm", "simple-lama-inpainting>=0.1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
# the web app (both modalities + shared history)
studio = "studio.app:main"
charla-web = "studio.app:main"
escalate-web = "studio.app:main"
studio-worker = "studio.worker:main"
# Conversación
charla = "charla.cli:main"
charla-ui = "charla.ui:main"
charla-upload = "charla.tiktok:main"
charla-lote = "charla.batch:main"
# Escalera
escalate = "escalator.cli:main"
escalate-ui = "escalator.ui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
charla = ["data/*.json"]
